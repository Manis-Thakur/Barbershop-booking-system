<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Select Date & Time</title>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            background-color: #f9f6f1;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px;
            color: #3b2b20;
        }

        h1 {
            font-size: 2rem;
            font-weight: 700;
            color: #2e1a11;
            margin-bottom: 5px;
        }

        h3 {
            margin-bottom: 15px;
        }

        .subtitle {
            color: #7b6b5d;
            font-size: 1rem;
            margin-bottom: 40px;
        }

        .main-wrapper {
            display: flex;
            gap: 40px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .box {
            background-color: #fff;
            padding: 30px 40px;
            border-radius: 20px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
            min-width: 340px;
        }

        /* Calendar Styles */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .calendar-header button {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #5a2d1a;
        }

        .calendar-header button:hover {
            color: #c98d55;
        }

        .calendar {
            display: grid;
            grid-template-columns: repeat(7, 40px);
            gap: 6px;
            justify-content: center;
            margin-top: 10px;
        }

        .calendar div {
            text-align: center;
            padding: 8px;
            border-radius: 8px;
            cursor: pointer;
        }

        .calendar div.header {
            font-weight: 600;
            color: #555;
            cursor: default;
        }

        .calendar div.day:hover {
            background-color: #f0e6da;
        }

        .calendar div.selected {
            background-color: #d29c68;
            color: #fff;
        }

        /* Time Slots */
        .time-slots {
            display: grid;
            grid-template-columns: repeat(3, 100px);
            gap: 12px;
            justify-content: center;
            margin-top: 10px;
        }

        .time-slot {
            background-color: #f6f0e6;
            border: 1px solid #e2d4c3;
            border-radius: 8px;
            padding: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .time-slot:hover {
            background-color: #e8d6bf;
        }

        .time-slot.selected {
            background-color: #d29c68;
            color: #fff;
            border-color: #c98d55;
        }

        .selected-info {
            margin-top: 30px;
            font-size: 1.1rem;
            color: #3b2b20;
            font-weight: 500;
        }

        /* Step Indicators */
        .steps {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 40px;
        }

        .step {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .circle {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #5a2d1a;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
        }

        .circle.inactive {
            background-color: #e0d9cf;
            color: #a7a099;
        }

        .line {
            width: 40px;
            height: 3px;
            background-color: #e0d9cf;
        }

        @media (max-width: 760px) {
            .main-wrapper {
                flex-direction: column;
                align-items: center;
            }
        }
    </style>
</head>

<body>

    <!-- Step Progress -->
    <div class="steps">
        <div class="step">
            <div class="circle">1</div>
            <div class="line"></div>
        </div>
        <div class="step">
            <div class="circle">2</div>
            <div class="line"></div>
        </div>
        <div class="step">
            <div class="circle">3</div>
            <div class="line"></div>
        </div>
        <div class="step">
            <div class="circle inactive">4</div>
            <div class="line"></div>
        </div>
        <div class="step">
            <div class="circle inactive">5</div>
        </div>
    </div>

    <h1>Select Date & Time</h1>
    <p class="subtitle">Classic Haircut with Barber One</p>

    <div class="main-wrapper">
        <!-- Date Container -->
        <div class="box">
            <h3>Choose Date</h3>
            <div class="calendar-header">
                <button id="prevMonth">&#10094;</button>
                <div id="monthLabel"></div>
                <button id="nextMonth">&#10095;</button>
            </div>
            <div id="calendar" class="calendar"></div>
        </div>

        <!-- Time Container -->
        <div class="box">
            <h3>Choose Time</h3>
            <div class="time-slots" id="timeSlots">
                <div class="time-slot">10:00 AM</div>
                <div class="time-slot">11:00 AM</div>
                <div class="time-slot">12:00 PM</div>
                <div class="time-slot">2:00 PM</div>
                <div class="time-slot">3:00 PM</div>
                <div class="time-slot">4:00 PM</div>
                <div class="time-slot">5:00 PM</div>
            </div>
        </div>
    </div>

    <div class="selected-info" id="selectedInfo">No date/time selected</div>

    <script>
        // === Global Variables ===
        let currentMonth = new Date().getMonth();
        let currentYear = new Date().getFullYear();
        let selectedDate = null;
        let selectedTime = null;

        const calendar = document.getElementById("calendar");
        const monthLabel = document.getElementById("monthLabel");

        const monthNames = [
            "January", "February", "March", "April", "May", "June",
            "July", "August", "September", "October", "November", "December"
        ];

        // === Generate Calendar ===
        function renderCalendar(month, year) {
            const firstDay = new Date(year, month, 1);
            const lastDay = new Date(year, month + 1, 0);
            const startDay = firstDay.getDay();

            let html = "";
            monthLabel.textContent = `${monthNames[month]} ${year}`;

            const dayNames = ["Su", "Mo", "Tu", "We", "Th", "Fr", "Sa"];
            dayNames.forEach(d => html += `<div class="header">${d}</div>`);

            for (let i = 0; i < startDay; i++) html += `<div></div>`;

            for (let i = 1; i <= lastDay.getDate(); i++) {
                html += `<div class="day">${i}</div>`;
            }

            calendar.innerHTML = html;
        }

        renderCalendar(currentMonth, currentYear);

        // === Month Navigation ===
        document.getElementById("prevMonth").addEventListener("click", () => {
            currentMonth--;
            if (currentMonth < 0) {
                currentMonth = 11;
                currentYear--;
            }
            renderCalendar(currentMonth, currentYear);
        });

        document.getElementById("nextMonth").addEventListener("click", () => {
            currentMonth++;
            if (currentMonth > 11) {
                currentMonth = 0;
                currentYear++;
            }
            renderCalendar(currentMonth, currentYear);
        });

        // === Date Selection ===
        calendar.addEventListener("click", (e) => {
            if (e.target.classList.contains("day")) {
                document.querySelectorAll(".day").forEach(d => d.classList.remove("selected"));
                e.target.classList.add("selected");
                selectedDate = `${monthNames[currentMonth]} ${e.target.textContent}, ${currentYear}`;
                updateSelectedInfo();
            }
        });

        // === Time Slot Selection ===
        const timeSlots = document.querySelectorAll(".time-slot");
        timeSlots.forEach(slot => {
            slot.addEventListener("click", () => {
                timeSlots.forEach(s => s.classList.remove("selected"));
                slot.classList.add("selected");
                selectedTime = slot.textContent;
                updateSelectedInfo();
            });
        });

        // === Display Selection ===
        function updateSelectedInfo() {
            const info = document.getElementById("selectedInfo");
            if (selectedDate && selectedTime) {
                info.textContent = `Selected: ${selectedDate} at ${selectedTime}`;
            } else if (selectedDate) {
                info.textContent = `Selected date: ${selectedDate}`;
            } else if (selectedTime) {
                info.textContent = `Selected time: ${selectedTime}`;
            } else {
                info.textContent = "No date/time selected";
            }
        }
    </script>
</body>

</html>
