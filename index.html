<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GroomEase</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f8f3e9;
            color: #333;
        }

        /* NAVBAR */
        .navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 55px;
            padding: 15px 60px;
            background: white;
            border-bottom: 1px solid #ddd;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 22px;
            font-weight: bold;
        }

        .logo-icon {
            width: 35px;
            height: 35px;
            background: #7b4b2a;
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            font-size: 18px;
        }

        .subtext {
            font-size: 14px;
            color: gray;
            margin-top: -5px;
        }

        .nav-actions {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .btn {
            padding: 8px 20px;
            border-radius: 6px;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .btn-outline {
            background: transparent;
            border: 1px solid #555;
        }

        .btn-primary {
            background: #7b4b2a;
            color: white;
        }

        /* HEADER IMAGE */
        .header-img {
            width: 100%;
            height: 350px;
            object-fit: cover;
            display: block;
        }

        /* STEP INDICATOR */
        .steps {
            text-align: center;
            margin: 30px 0;
            font-size: 20px;
            display: flex;
            justify-content: center;
            gap: 40px;
        }

        .step {
            width: 35px;
            height: 35px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 2px solid #aaa;
            cursor: pointer;
            font-weight: bold;
        }

        .active {
            background: #7b4b2a;
            color: white;
            border-color: #7b4b2a;
        }

        /* CONTENT SECTION */
        .content {
            text-align: center;
            padding: 20px;
        }

        h1 {
            margin: 0;
            font-size: 35px;
        }

        p {
            margin-top: 10px;
            color: #555;
            font-size: 16px;
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->
    <nav class="navbar">
        <div>
            <div class="logo">
                <div class="logo-icon">✂</div>
                GroomEase
            </div>
            <div class="subtext">Professional grooming services</div>
        </div>

        <div class="nav-actions">
            <button class="btn btn-outline">Products</button>
            <button class="btn btn-outline">Sign In</button>
            <button class="btn btn-primary">Sign Up</button>
        </div>
    </nav>

    <!-- HEADER IMAGE -->
    <img class="header-img" src="background.jpg" alt="Barbershop" />

    <!-- STEPS -->
    <div class="steps">
        <div class="step active">1</div>
        <div class="step">2</div>
        <div class="step">3</div>
        <div class="step">4</div>
    </div>

    <!-- CONTENT -->
    <div class="content">
        <h1>Choose Your Service</h1>
        <p>Select the service you'd like to book</p>
    </div>

</body>

</html>
